<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Calon Pelanggan Wifi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #34b7f1; 
            --secondary-color: #0d95e8;
            --bg-color: #f0f2f5;
            --accent-color: #28a745;
            --danger-color: #dc3545;
            --wa-color: #25d366;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            padding: 15px; 
            line-height: 1.4; 
            max-width: 500px; 
            margin: auto; 
            background-color: var(--bg-color); 
        }

        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            position: relative;
        }

        h2 { color: #333; text-align: center; margin-bottom: 20px; font-size: 1.5rem; }
        
        label { font-weight: bold; display: block; margin-top: 15px; color: #444; font-size: 0.9rem; }
        
        input, select, textarea { 
            width: 100%; padding: 12px; margin: 8px 0; 
            border: 1px solid #ddd; border-radius: 8px; 
            box-sizing: border-box; font-size: 16px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-group input {
            flex: 1; 
            margin: 0;
            background-color: #f1f1f1;
            color: #555;
            font-size: 14px;
        }

        .btn-process {
            padding: 12px 15px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap;
            transition: 0.3s;
        }

        /* Grouping Section untuk Tombol */
        .copy-group {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed #ccc;
        }

        .copy-label {
            display: block;
            text-align: center;
            font-weight: bold;
            color: #666;
            margin-bottom: 12px;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .button-wrapper {
            display: flex;
            gap: 10px;
        }

        .btn-main { 
            flex: 1; 
            padding: 14px 5px; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px; /* Jarak antara ikon dan teks */
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-blue {
            background-color: var(--primary-color); 
            box-shadow: 0 4px 10px rgba(52, 183, 241, 0.3);
        }

        .btn-whatsapp {
            background-color: var(--wa-color);
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }

        #toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            z-index: 1000;
            display: none;
            width: 80%;
            pointer-events: none;
        }
        
        .success-flash { background-color: #28a745 !important; }
    </style>
</head>
<body>

<div class="card">
    <div id="toast"></div>

    <h2>Data Calon Pelanggan</h2>
    
    <input type="text" id="nama" placeholder="Nama Pelanggan">
    <textarea id="alamat" rows="2" placeholder="Alamat Lengkap / Patokan"></textarea>
    <input type="tel" id="whatsapp_pelanggan" placeholder="Nomor WhatsApp">
    
    <label>Koordinat Maps ( Contoh : -6.123, 109.123)</label>
    <div class="input-group">
        <input type="text" id="map-link" placeholder="URL otomatis muncul..." readonly>
        <button type="button" id="btnPasteCopy" class="btn-process" onclick="handleMapLogic()">PASTE KOORDINAT</button>
    </div>
    
    <label>Pilihan Paket</label>
    <select id="paket">
        <option value="">-- Pilih Paket --</option>
        <option value="Lite 130k">Lite 130k</option>
        <option value="Basic 175k">Basic 175k</option>
        <option value="Pro 220k">Pro 220k</option>
        <option value="Combo TV 250k">Combo TV 250k</option>
        <option value="Gamers 315k">Gamers 315k</option>
        <option value="Fun 510k">Fun 510k</option>
    </select>
    
    <div class="copy-group">
        <span class="copy-label">SALIN KE :</span>
        <div class="button-wrapper">
            <button id="btnAction" class="btn-main btn-blue" onclick="copyFullData()">
                <i class="fa-regular fa-clipboard"></i> KLIPBOARD
            </button>
            <button id="btnWA" class="btn-main btn-whatsapp" onclick="sendToWhatsApp()">
                <i class="fa-brands fa-whatsapp"></i> WHATSAPP
            </button>
        </div>
    </div>
</div>

<script>
    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.style.display = 'block';
        toast.style.backgroundColor = isError ? 'rgba(220, 53, 69, 0.95)' : 'rgba(0, 0, 0, 0.85)';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    async function handleMapLogic() {
        const btn = document.getElementById('btnPasteCopy');
        const inputMap = document.getElementById('map-link');
        try {
            const text = await navigator.clipboard.readText();
            const coordRegex = /(-?\d+\.\d+),\s*(-?\d+\.\d+)/;
            const match = text.match(coordRegex);
            if (match) {
                const finalUrl = `https://www.google.com/maps?q=${match[1]},${match[2]}`;
                inputMap.value = finalUrl;
                await navigator.clipboard.writeText(finalUrl);
                btn.innerText = "BERHASIL ✅";
                btn.style.backgroundColor = "#218838";
                showToast("Link Maps berhasil dibuat!");
                setTimeout(() => { 
                    btn.innerText = "PASTE KOORDINAT"; 
                    btn.style.backgroundColor = ""; 
                }, 2000);
            } else {
                showToast("Koordinat tidak ditemukan!", true);
            }
        } catch (err) {
            showToast("Gagal akses clipboard!", true);
        }
    }

    function getFormattedData() {
        const nama = document.getElementById('nama').value;
        const alamat = document.getElementById('alamat').value;
        const waPelanggan = document.getElementById('whatsapp_pelanggan').value;
        const mapLink = document.getElementById('map-link').value;
        const paket = document.getElementById('paket').value;

        if (!nama || !mapLink) {
            showToast("Nama & Maps wajib diisi!", true);
            return null;
        }

        return `*DATA CALON PELANGGAN*\n\n` +
               `*Nama:* ${nama}\n` +
               `*Alamat:* ${alamat}\n` +
               `*Nomor WA:* ${waPelanggan}\n` +
               `*Maps:* ${mapLink}\n` +
               `*Paket:* ${paket}`;
    }

    function copyFullData() {
        const teks = getFormattedData();
        if (!teks) return;
        navigator.clipboard.writeText(teks).then(() => {
            const btn = document.getElementById('btnAction');
            btn.classList.add('success-flash');
            showToast("Data disalin ke klipboard!");
            setTimeout(() => btn.classList.remove('success-flash'), 2000);
        });
    }

    function sendToWhatsApp() {
        const teks = getFormattedData();
        if (!teks) return;
        navigator.clipboard.writeText(teks).then(() => {
            const encodedText = encodeURIComponent(teks);
            window.open(`https://api.whatsapp.com/send?text=${encodedText}`, '_blank');
        });
    }
</script>

</body>
</html>
