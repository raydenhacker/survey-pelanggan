<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey WiFi - Copy to Clipboard</title>
    <style>
        :root {
            --primary-color: #34b7f1; /* Warna Biru (Copy) */
            --secondary-color: #0d95e8;
            --bg-color: #f0f2f5;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            padding: 15px; 
            line-height: 1.4; 
            max-width: 500px; 
            margin: auto; 
            background-color: var(--bg-color); 
        }

        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }

        h2 { color: #333; text-align: center; margin-bottom: 20px; font-size: 1.5rem; }
        
        label { font-weight: bold; display: block; margin-top: 15px; color: #444; font-size: 0.9rem; }
        
        input, select, textarea { 
            width: 100%; padding: 12px; margin: 8px 0; 
            border: 1px solid #ddd; border-radius: 8px; 
            box-sizing: border-box; font-size: 16px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-group input {
            flex: 1; 
            margin: 0;
            background-color: #f9f9f9;
        }

        .btn-paste {
            padding: 12px 15px;
            background-color: #666;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            transition: 0.3s;
        }

        .btn-paste:hover { background-color: #444; }

        .hint { font-size: 0.75rem; color: #777; margin-top: 5px; font-style: italic; }
        
        .btn-copy { 
            width: 100%; padding: 16px; background-color: var(--primary-color); 
            color: white; border: none; border-radius: 10px; 
            font-weight: bold; cursor: pointer; font-size: 17px; 
            margin-top: 25px; box-shadow: 0 4px 10px rgba(52, 183, 241, 0.3);
            transition: 0.3s;
        }
        
        .btn-copy:hover { background-color: var(--secondary-color); }
        .btn-success { background-color: #28a745 !important; }
    </style>
</head>
<body>

<div class="card">
    <h2>Data Pemasangan</h2>
    
    <input type="text" id="nama" placeholder="Nama Pelanggan">
    <textarea id="alamat" rows="2" placeholder="Alamat Lengkap / Patokan"></textarea>
    <input type="tel" id="whatsapp_pelanggan" placeholder="Nomor WhatsApp">
    
    <label>Link / Koordinat Maps</label>
    <div class="input-group">
        <input type="text" id="map-link" placeholder="Paste koordinat di sini..." readonly>
        <button type="button" class="btn-paste" onclick="pasteCoordinates()">PASTE</button>
    </div>
    <p class="hint">*Copy koordinat dari Google Maps, lalu tekan tombol PASTE</p>
    
    <label>Paket & WiFi</label>
    <select id="paket">
        <option value="">-- Pilih Paket --</option>
        <option value="Lite 130k">Lite 130k</option>
        <option value="Basic 175k">Basic 175k</option>
        <option value="Pro 220k">Pro 220k</option>
        <option value="Combo TV 250k">Combo TV 250k</option>
        <option value="Gamers 315k">Gamers 315k</option>
        <option value="Fun 510k">Fun 510k</option>
    </select>
    
    <input type="text" id="wifi" placeholder="Nama WiFi">
    <input type="text" id="sandi" placeholder="Sandi WiFi">
    
    <button id="btnAction" class="btn-copy" onclick="copyToClipboard()">SALIN DATA KE CLIPBOARD</button>
</div>

<script>
    async function pasteCoordinates() {
        try {
            const text = await navigator.clipboard.readText();
            const coordRegex = /(-?\d+\.\d+),\s*(-?\d+\.\d+)/;
            const match = text.match(coordRegex);

            if (match) {
                const lat = match[1];
                const lng = match[2];
                // Link Maps format standar
                const formattedUrl = `https://www.google.com/maps?q=${lat},${lng}`;
                document.getElementById("map-link").value = formattedUrl;
            } else {
                document.getElementById("map-link").value = text;
            }
        } catch (err) {
            alert("Gagal mengakses clipboard. Pastikan izin aktif.");
        }
    }

    function copyToClipboard() {
        const nama = document.getElementById('nama').value;
        const alamat = document.getElementById('alamat').value;
        const waPelanggan = document.getElementById('whatsapp_pelanggan').value;
        const mapLink = document.getElementById('map-link').value;
        const paket = document.getElementById('paket').value;
        const wifi = document.getElementById('wifi').value;
        const sandi = document.getElementById('sandi').value;

        if (!nama || !mapLink) {
            alert("Nama dan Link Maps wajib diisi!");
            return;
        }

        // Format teks untuk clipboard (menggunakan \n untuk baris baru)
        const teksLengkap = `*DATA PEMASANGAN WIFI*\n\n` +
                          `*Nama:* ${nama}\n` +
                          `*Alamat:* ${alamat}\n` +
                          `*Nomor WA:* ${waPelanggan}\n` +
                          `*Maps:* ${mapLink}\n` +
                          `*Paket:* ${paket}\n` +
                          `*WiFi:* ${wifi}\n` +
                          `*Sandi:* ${sandi}`;

        // Proses Copy
        navigator.clipboard.writeText(teksLengkap).then(() => {
            const btn = document.getElementById('btnAction');
            const originalText = btn.innerText;
            
            // Efek Visual Berhasil
            btn.innerText = "✅ BERHASIL DISALIN!";
            btn.classList.add('btn-success');
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('btn-success');
            }, 2000);
        }).catch(err => {
            alert('Gagal menyalin teks: ', err);
        });
    }
</script>

</body>
</html>
