<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Calon Pelanggan Wifi</title>
    <style>
        :root {
            --primary-color: #34b7f1; 
            --secondary-color: #0d95e8;
            --bg-color: #f0f2f5;
            --accent-color: #28a745;
            --danger-color: #dc3545;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            padding: 15px; 
            line-height: 1.4; 
            max-width: 500px; 
            margin: auto; 
            background-color: var(--bg-color); 
            position: relative;
        }

        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            position: relative;
        }

        h2 { color: #333; text-align: center; margin-bottom: 20px; font-size: 1.5rem; }
        
        label { font-weight: bold; display: block; margin-top: 15px; color: #444; font-size: 0.9rem; }
        
        input, select, textarea { 
            width: 100%; padding: 12px; margin: 8px 0; 
            border: 1px solid #ddd; border-radius: 8px; 
            box-sizing: border-box; font-size: 16px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-group input {
            flex: 1; 
            margin: 0;
            background-color: #f1f1f1;
            color: #555;
            font-size: 14px;
        }

        .btn-process {
            padding: 12px 15px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap;
            transition: 0.3s;
            min-width: 140px;
        }

        /* Notifikasi Mengambang */
        #toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            z-index: 1000;
            display: none;
            width: 80%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        .btn-main { 
            width: 100%; padding: 16px; background-color: var(--primary-color); 
            color: white; border: none; border-radius: 10px; 
            font-weight: bold; cursor: pointer; font-size: 17px; 
            margin-top: 25px; box-shadow: 0 4px 10px rgba(52, 183, 241, 0.3);
            transition: 0.3s;
        }
        
        .success-flash { background-color: #28a745 !important; }
    </style>
</head>
<body>

<div class="card">
    <div id="toast"></div>

    <h2>Data Calon Pelanggan</h2>
    
    <input type="text" id="nama" placeholder="Nama Pelanggan">
    <textarea id="alamat" rows="2" placeholder="Alamat Lengkap / Patokan"></textarea>
    <input type="tel" id="whatsapp_pelanggan" placeholder="Nomor WhatsApp">
    
    <label>Link / Koordinat Maps</label>
    <div class="input-group">
        <input type="text" id="map-link" placeholder="URL otomatis muncul..." readonly>
        <button type="button" id="btnPasteCopy" class="btn-process" onclick="handleMapLogic()">PASTE KOORDINAT</button>
    </div>
    
    <label>Pilihan Paket</label>
    <select id="paket">
        <option value="">-- Pilih Paket --</option>
        <option value="Lite 130k">Lite 130k</option>
        <option value="Basic 175k">Basic 175k</option>
        <option value="Pro 220k">Pro 220k</option>
        <option value="Combo TV 250k">Combo TV 250k</option>
        <option value="Gamers 315k">Gamers 315k</option>
        <option value="Fun 510k">Fun 510k</option>
    </select>
    
    <button id="btnAction" class="btn-main" onclick="copyFullData()">SALIN SEMUA DATA</button>
</div>

<script>
    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.style.display = 'block';
        toast.style.backgroundColor = isError ? 'rgba(220, 53, 69, 0.95)' : 'rgba(0, 0, 0, 0.85)';
        
        setTimeout(() => {
            toast.style.display = 'none';
        }, 2000);
    }

    async function handleMapLogic() {
        const btn = document.getElementById('btnPasteCopy');
        const inputMap = document.getElementById('map-link');

        try {
            const text = await navigator.clipboard.readText();
            const coordRegex = /(-?\d+\.\d+),\s*(-?\d+\.\d+)/;
            const match = text.match(coordRegex);

            if (match) {
                const lat = match[1];
                const lng = match[2];
                const finalUrl = `https://www.google.com/maps?q=${lat},${lng}`;
                
                inputMap.value = finalUrl;
                await navigator.clipboard.writeText(finalUrl);

                // Perubahan tombol
                const originalText = "PASTE KOORDINAT";
                btn.innerText = "URL BERHASIL DIBUAT ✅";
                btn.style.backgroundColor = "#218838";
                
                // Munculkan notifikasi mengambang
                showToast("URL Maps berhasil disalin!");

                setTimeout(() => { 
                    btn.innerText = originalText; 
                    btn.style.backgroundColor = ""; 
                }, 2000);

            } else {
                showToast("Bukan format koordinat yang valid!", true);
            }
        } catch (err) {
            showToast("Izin clipboard ditolak!", true);
        }
    }

    function copyFullData() {
        const nama = document.getElementById('nama').value;
        const alamat = document.getElementById('alamat').value;
        const waPelanggan = document.getElementById('whatsapp_pelanggan').value;
        const mapLink = document.getElementById('map-link').value;
        const paket = document.getElementById('paket').value;

        if (!nama || !mapLink) {
            showToast("Nama & Maps wajib diisi!", true);
            return;
        }

        const teksLengkap = `*DATA CALON PELANGGAN*\n\n` +
                          `*Nama:* ${nama}\n` +
                          `*Alamat:* ${alamat}\n` +
                          `*Nomor WA:* ${waPelanggan}\n` +
                          `*Maps:* ${mapLink}\n` +
                          `*Paket:* ${paket}`;

        navigator.clipboard.writeText(teksLengkap).then(() => {
            const btn = document.getElementById('btnAction');
            btn.classList.add('success-flash');
            showToast("Semua data berhasil disalin!");
            
            setTimeout(() => {
                btn.classList.remove('success-flash');
            }, 2000);
        });
    }
</script>

</body>
</html>
