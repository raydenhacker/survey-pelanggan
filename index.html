<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Pelanggan WiFi</title>
    <style>
        :root {
            --primary-color: #34b7f1; 
            --secondary-color: #0d95e8;
            --bg-color: #f0f2f5;
            --gray-color: #666;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            padding: 15px; 
            line-height: 1.4; 
            max-width: 500px; 
            margin: auto; 
            background-color: var(--bg-color); 
        }

        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }

        h2 { color: #333; text-align: center; margin-bottom: 20px; font-size: 1.5rem; }
        
        label { font-weight: bold; display: block; margin-top: 15px; color: #444; font-size: 0.9rem; }
        
        input, select, textarea { 
            width: 100%; padding: 12px; margin: 8px 0; 
            border: 1px solid #ddd; border-radius: 8px; 
            box-sizing: border-box; font-size: 16px;
        }

        .input-group {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .input-group input {
            flex: 1; 
            margin: 0;
            background-color: #f9f9f9;
        }

        .btn-action-small {
            padding: 12px 10px;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            white-space: nowrap;
            transition: 0.3s;
            min-width: 65px;
        }

        .btn-paste { background-color: var(--gray-color); }
        .btn-paste:hover { background-color: #444; }

        .btn-copy-url { background-color: #28a745; }
        .btn-copy-url:hover { background-color: #218838; }

        .hint { font-size: 0.75rem; color: #777; margin-top: 5px; font-style: italic; }
        
        .btn-main { 
            width: 100%; padding: 16px; background-color: var(--primary-color); 
            color: white; border: none; border-radius: 10px; 
            font-weight: bold; cursor: pointer; font-size: 17px; 
            margin-top: 25px; box-shadow: 0 4px 10px rgba(52, 183, 241, 0.3);
            transition: 0.3s;
        }
        
        .btn-main:hover { background-color: var(--secondary-color); }
        .btn-success-anim { background-color: #28a745 !important; }
    </style>
</head>
<body>

<div class="card">
    <h2>Data Pemasangan</h2>
    
    <input type="text" id="nama" placeholder="Nama Pelanggan">
    <textarea id="alamat" rows="2" placeholder="Alamat Lengkap / Patokan"></textarea>
    <input type="tel" id="whatsapp_pelanggan" placeholder="Nomor WhatsApp">
    
    <label>Link / Koordinat Maps</label>
    <div class="input-group">
        <input type="text" id="map-link" placeholder="Hasil URL Maps..." readonly>
        <button type="button" class="btn-action-small btn-paste" onclick="pasteCoordinates()">PASTE</button>
        <button type="button" class="btn-action-small btn-copy-url" onclick="copyMapOnly()">COPY</button>
    </div>
    <p class="hint">*Tekan PASTE untuk generate URL dari koordinat, COPY untuk ambil link saja.</p>
    
    <label>Pilihan Paket</label>
    <select id="paket">
        <option value="">-- Pilih Paket --</option>
        <option value="Lite 130k">Lite 130k</option>
        <option value="Basic 175k">Basic 175k</option>
        <option value="Pro 220k">Pro 220k</option>
        <option value="Combo TV 250k">Combo TV 250k</option>
        <option value="Gamers 315k">Gamers 315k</option>
        <option value="Fun 510k">Fun 510k</option>
    </select>
    
    <button id="btnAction" class="btn-main" onclick="copyFullData()">SALIN SEMUA DATA</button>
</div>

<script>
    // Fungsi untuk menempel dan memformat koordinat
    async function pasteCoordinates() {
        try {
            const text = await navigator.clipboard.readText();
            // Regex untuk menangkap pola koordinat (lat, lng)
            const coordRegex = /(-?\d+\.\d+),\s*(-?\d+\.\d+)/;
            const match = text.match(coordRegex);

            if (match) {
                const lat = match[1];
                const lng = match[2];
                const formattedUrl = `https://www.google.com/maps?q=${lat},${lng}`;
                document.getElementById("map-link").value = formattedUrl;
            } else {
                // Jika bukan koordinat, masukkan teks mentah (asumsi link sudah jadi)
                document.getElementById("map-link").value = text;
            }
        } catch (err) {
            alert("Gagal mengakses clipboard. Pastikan izin aktif di browser.");
        }
    }

    // Fungsi khusus salin URL Maps saja
    function copyMapOnly() {
        const mapLink = document.getElementById("map-link").value;
        if (!mapLink) {
            alert("Belum ada link untuk disalin!");
            return;
        }
        navigator.clipboard.writeText(mapLink).then(() => {
            alert("Link Maps berhasil disalin!");
        });
    }

    // Fungsi salin semua data
    function copyFullData() {
        const nama = document.getElementById('nama').value;
        const alamat = document.getElementById('alamat').value;
        const waPelanggan = document.getElementById('whatsapp_pelanggan').value;
        const mapLink = document.getElementById('map-link').value;
        const paket = document.getElementById('paket').value;

        if (!nama || !mapLink) {
            alert("Nama dan Link Maps wajib diisi!");
            return;
        }

        const teksLengkap = `*DATA CALON PELANGGAN*\n\n` +
                          `*Nama:* ${nama}\n` +
                          `*Alamat:* ${alamat}\n` +
                          `*Nomor WA:* ${waPelanggan}\n` +
                          `*Maps:* ${mapLink}\n` +
                          `*Paket:* ${paket}`;

        navigator.clipboard.writeText(teksLengkap).then(() => {
            const btn = document.getElementById('btnAction');
            const originalText = btn.innerText;
            
            btn.innerText = "✅ DATA BERHASIL DISALIN!";
            btn.classList.add('btn-success-anim');
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('btn-success-anim');
            }, 2000);
        }).catch(err => {
            alert('Gagal menyalin teks: ', err);
        });
    }
</script>

</body>
</html>
